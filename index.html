<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hello · llyt · just a kiss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1a1040 0%, #0a0a1a 55%, #05050f 100%);
    overflow: hidden;
    color: #fff;
  }
  #stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 0 24px;
  }
  .word {
    font-size: clamp(44px, 11vw, 110px);
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1.25;
    background: linear-gradient(120deg, #ff6ec4 0%, #ffb86b 40%, #7ef9ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    filter: blur(14px) brightness(1.6);
    transform: translateY(28px) scale(0.94);
    text-shadow: 0 0 60px rgba(255, 110, 196, 0.35);
    position: relative;
  }
  .word.show {
    animation: riseIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes riseIn {
    0%   { opacity: 0; filter: blur(14px) brightness(1.6); transform: translateY(28px) scale(0.94); }
    60%  { opacity: 1; filter: blur(0) brightness(1.35); transform: translateY(0) scale(1.03); }
    100% { opacity: 1; filter: blur(0) brightness(1); transform: translateY(0) scale(1); }
  }
  .glow {
    position: relative;
    display: inline-block;
    background: linear-gradient(120deg, #ff6ec4 0%, #ffb86b 40%, #7ef9ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 220% auto;
    animation: shine 4.5s linear infinite;
  }
  @keyframes shine {
    0%   { background-position: 0% center; }
    100% { background-position: 220% center; }
  }
  .word:not(.show) .glow { animation: none; }
  .sub {
    margin-top: 26px;
    font-size: 15px;
    letter-spacing: 6px;
    color: rgba(255, 255, 255, 0.35);
    opacity: 0;
    transition: opacity 1.2s ease 0.3s;
  }
  .sub.show { opacity: 1; }
  .heart {
    position: fixed;
    z-index: 3;
    font-size: 14px;
    color: #ff6ec4;
    pointer-events: none;
    animation: floatUp 2.8s ease-out forwards;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.4); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-130px) scale(1.3); }
  }
  .hint {
    position: fixed;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 2;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.22);
  }
  .cursor {
    display: inline-block;
    width: 0.12em;
    height: 0.9em;
    background: currentColor;
    vertical-align: -0.08em;
    margin-left: 0.05em;
    animation: blink 0.9s steps(1) infinite;
    opacity: 0;
  }
  .word.show .cursor { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="stage">
  <h1 class="word" id="w1"><span class="glow"></span></h1>
  <h1 class="word" id="w2"><span class="glow"></span></h1>
  <h1 class="word" id="w3"><span class="glow"></span></h1>
  <p class="sub" id="sub">just a kiss ... forever yours</p>
</div>
<div class="hint">click anywhere / tap screen</div>
<script>
(function () {
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var W, H, particles = [];
  var mouse = { x: -9999, y: -9999 };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var count = Math.min(160, Math.floor(W * H / 9000));
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        hue: Math.random() * 60 + 280,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.tw += 0.03;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;

      var dx = p.x - mouse.x;
      var dy = p.y - mouse.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 140 && dist > 0.01) {
        p.x += dx / dist * 0.7;
        p.y += dy / dist * 0.7;
      }

      var alpha = 0.35 + 0.55 * Math.abs(Math.sin(p.tw));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 90%, 72%, ' + alpha + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  resize();
  draw();

  var phrases = ['hello', 'llyt', 'just a kiss'];
  var words = [document.getElementById('w1'), document.getElementById('w2'), document.getElementById('w3')];

  function typeWord(el, text, done) {
    var glow = el.querySelector('.glow');
    el.classList.add('show');
    var i = 0;
    var t = setInterval(function () {
      if (i < text.length) {
        glow.textContent = text.slice(0, ++i);
      } else {
        clearInterval(t);
        done();
      }
    }, 120);
  }

  function burstHearts() {
    var colors = ['#ff6ec4', '#ffb86b', '#7ef9ff', '#ff8fab'];
    for (var i = 0; i < 26; i++) {
      (function () {
        var h = document.createElement('span');
        h.className = 'heart';
        h.textContent = 'x';
        h.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * window.innerWidth * 0.7) + 'px';
        h.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * window.innerHeight * 0.5) + 'px';
        h.style.color = colors[Math.floor(Math.random() * colors.length)];
        h.style.animationDelay = (Math.random() * 0.8) + 's';
        h.style.fontSize = (10 + Math.random() * 16) + 'px';
        document.body.appendChild(h);
        setTimeout(function () { h.remove(); }, 4000);
      })();
    }
  }

  setTimeout(function () {
    typeWord(words[0], phrases[0], function () {
      setTimeout(function () {
        typeWord(words[1], phrases[1], function () {
          setTimeout(function () {
            typeWord(words[2], phrases[2], function () {
              document.getElementById('sub').classList.add('show');
              burstHearts();
            });
          }, 350);
        });
      }, 350);
    });
  }, 600);

  var hint = document.querySelector('.hint');
  document.body.addEventListener('click', function () {
    if (hint.style.opacity !== '0') { hint.style.opacity = '0'; }
    burstHearts();
  });
})();
</script>
</body>
</html>
