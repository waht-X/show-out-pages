<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静态网页 Demo · GitHub Pages</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(160deg, #f5f7fa 0%, #eef2f7 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(30, 60, 114, 0.10);
    padding: 48px 56px;
    max-width: 640px;
    width: 100%;
  }
  .badge {
    display: inline-block;
    background: #e8f0fe;
    color: #185fa5;
    font-size: 13px;
    font-weight: 500;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    color: #1f2d3d;
    margin-bottom: 12px;
  }
  p.sub {
    color: #5f6b7a;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .divider {
    height: 1px;
    background: #e6ebf1;
    margin-bottom: 28px;
  }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #3a4657;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 14px;
  }
  li .dot {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #e8f0fe;
    color: #185fa5;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #e6ebf1;
    color: #8a95a5;
    font-size: 13px;
  }
  .footer a {
    color: #185fa5;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">GitHub Pages · 免费托管</span>
    <h1>静态网页 Demo 部署成功</h1>
    <p class="sub">这是一个通过 GitHub Pages 免费托管的静态页面,无需购买服务器、无需域名,代码推送到 GitHub 仓库后,任何人都可以通过公网链接访问。</p>
    <div class="divider"></div>
    <ul>
      <li><span class="dot">1</span>编写 HTML / CSS 静态文件</li>
      <li><span class="dot">2</span>推送到 GitHub 仓库</li>
      <li><span class="dot">3</span>开启 GitHub Pages 服务</li>
      <li><span class="dot">4</span>获得 https://waht-x.github.io/show-out-pages/ 访问链接</li>
    </ul>
    <div class="footer">Demo 页面 · 2026-08-20 · 由 WorkBuddy 编写 · <a href="https://github.com/waht-X/show-out-pages" target="_blank">查看仓库</a></div>
  </div>
</body>
</html>
