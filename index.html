<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hello · llyt · just a kiss</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars"></canvas>
<button class="music-btn" id="musicBtn" title="播放背景音乐">&#9835;</button>
<div class="page" style="justify-content:center; text-align:center;">
  <h1 class="big-title glow-text" id="line1" style="margin-bottom:6px;"></h1>
  <h1 class="big-title glow-text" id="line2" style="margin-bottom:6px;"></h1>
  <h1 class="big-title glow-text" id="line3"></h1>
  <p class="sub-text" id="sub">一份为你准备的小惊喜,慢慢看下去吧 &#10024;</p>
  <a class="btn hidden" id="enterBtn" href="letter.html">点开我的心意 &#128140;</a>
  <p class="sub-text" id="hint" style="margin-top:34px; font-size:12px; letter-spacing:3px; color:rgba(255,255,255,0.25);">( 音乐即将响起,点一下页面可提前开启 &#127911; )</p>
</div>
<script src="shared.js"></script>
<script>
(function () {
  var phrases = ['hello', 'llyt', 'just a kiss'];
  var ids = ['line1', 'line2', 'line3'];
  var els = ids.map(function (id) { return document.getElementById(id); });

  function typeWord(el, text, done) {
    var i = 0;
    el.innerHTML = '<span></span><span class="cursor"></span>';
    var span = el.querySelector('span');
    var t = setInterval(function () {
      if (i < text.length) {
        span.textContent = text.slice(0, ++i);
      } else {
        clearInterval(t);
        el.querySelector('.cursor').remove();
        done();
      }
    }, 130);
  }

  function run() {
    typeWord(els[0], phrases[0], function () {
      setTimeout(function () {
        typeWord(els[1], phrases[1], function () {
          setTimeout(function () {
            typeWord(els[2], phrases[2], function () {
              setTimeout(function () {
                document.getElementById('sub').classList.add('show');
                var btn = document.getElementById('enterBtn');
                btn.classList.remove('hidden');
                document.getElementById('hint').style.opacity = '0';
                burstHearts(30);
                if (window.fireworks) fireworks(4000);
              }, 500);
            });
          }, 400);
        });
      }, 400);
    });
  }
  setTimeout(run, 600);

  var mb = document.getElementById('musicBtn');
  mb.addEventListener('click', function () { toggleMusic(mb); });
})();
</script>
</body>
</html>
